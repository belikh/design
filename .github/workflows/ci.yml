name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint   # one app, one component library, one token source, one class vocabulary (scripts/check-divergence.mjs) + style lint + the agent skill matches the repo (scripts/check-skill.mjs)
      - run: npm run typecheck
      - run: npm run check:versions   # every package and the Rust crate share the token version
      - run: npm run check:sample   # examples/data + the generated LaTeX report/invoice match the web fixtures (fix: npm run export:sample)
      - run: npm run build   # tokens: validate (schema, version sync, WCAG AA) + generate; app: tsc + vite build
      - run: npm test   # @belikh/jupiter-ui + admin (Vitest, incl. per-route accessibility) + ESPHome widget tests
      - run: npm run check:palette -w @belikh/jupiter-admin   # chart colours stay colour-vision safe
      - name: Real-browser interaction tests (focus, paste, drag, popovers, undo)
        run: npm run e2e -w @belikh/jupiter-admin
        env:
          CHROMIUM: google-chrome
      - name: One design change must reach a consumer project (builds examples/consumer, changes constants, verifies, restores)
        run: npm run check:consumer
      - name: Generated Rust core must be committed and current
        run: git diff --exit-code -- packages/rust/src/generated.rs
      - name: Generated GitHub kit (theme, SVG assets, this repo's banner) must be committed and current
        run: git diff --exit-code -- packages/github/src/theme.json packages/github/assets packages/github/graphics .github/assets/banner-light.svg .github/assets/banner-dark.svg .github/assets/social-preview-light.svg .github/assets/social-preview-dark.svg
      - run: npm run docs:check   # docs-src is valid and docs/*.md is current (fix: npm run docs:build)
      - run: node packages/docs/bin/jupiter-docs.mjs build --site   # the docs site builds (dist/site, deployable to Cloudflare Pages)
      - run: scripts/release-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
  latex:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:tokens && npm run build:graphics
      - name: Install TeX Live   # no texlive-fonts-extra or texlive-science: the templates load our SGI and JetBrains Mono files from packages/latex/fonts and use no science packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended poppler-utils latexmk librsvg2-bin
      - name: Regenerate the LaTeX graphics (PDFs from the design-system SVGs) and fail if the committed ones are stale
        run: |
          node packages/latex/scripts/graphics.mjs
          git diff --exit-code -- packages/latex/graphics/sources.lock || { echo "::error::packages/latex/graphics is stale (sources.lock differs): run node packages/latex/scripts/graphics.mjs and commit the result"; exit 1; }
      - name: Compile every template (with our SGI Text, SGI Alt and JetBrains Mono)
        run: |
          packages/latex/scripts/build.sh packages/latex/templates/*.tex
          for f in packages/latex/build/*.pdf; do
            fonts="$(pdffonts "$f" | tail -n +3)"; echo "== $f"; echo "$fonts"
            echo "$fonts" | grep -qi "SGIText" || { echo "::error::$f does not embed SGI Text"; exit 1; }
            if echo "$fonts" | grep -qiE "LMRoman|LMSans|LatinModern|CMR|CMSY|CMMI|Pagella|DejaVu|Fira"; then echo "::error::$f embeds a font that is not SGI Text, SGI Alt or JetBrains Mono"; exit 1; fi
          done
      - name: Build the documentation PDF (jupiter-docs.cls; fails on missing glyphs)
        run: |
          node packages/docs/bin/jupiter-docs.mjs build --pdf
          pdffonts dist/jupiter-docs.pdf | grep -qiE "sgi" && echo "SGI fonts embedded in the docs PDF"
      - uses: actions/upload-artifact@v4
        with:
          name: latex-samples
          path: |
            packages/latex/build/*.pdf
            dist/jupiter-docs.pdf
  rust:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - name: fmt, clippy, tests (every adapter)
        working-directory: packages/rust
        run: |
          cargo fmt --check
          cargo clippy --all-features -- -D warnings
          cargo test --all-features
  linux-gui:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:tokens
      - name: Validate GTK, QML and KDE outputs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 qml6-module-qtquick qt6-declarative-dev-tools
          python3 - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          from gi.repository import Gtk
          for f in ("jupiter-gtk-light.css", "jupiter-gtk-dark.css", "jupiter-gtk-widgets.css"):
              errs = []
              p = Gtk.CssProvider()
              p.connect("parsing-error", lambda prov, sec, err: errs.append(err.message))
              p.load_from_path("packages/tokens/dist/" + f)
              assert not errs, (f, errs)
          print("gtk css ok")
          PY
          /usr/lib/qt6/bin/qmllint packages/tokens/dist/Jupiter.qml || qmllint-qt6 packages/tokens/dist/Jupiter.qml
