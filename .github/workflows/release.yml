name: release
# On every push to main: if the token version is new, publish an immutable vX.Y.Z release whose assets have
# UNVERSIONED names, so consumers can target ".../releases/latest/download/<file>" ("current").
# Optionally also deploy the app (design-system docs + admin template, built from apps/admin) at / plus /current/ and /vX.Y.Z/ to Cloudflare Pages (set the repo variable CLOUDFLARE_PAGES_PROJECT
# and secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Decide version
        id: v
        run: |
          version="$(node -p "require('./packages/tokens/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Breaking-change gate (removed --jp-* variables or .jp-* classes need a major bump)
        if: steps.v.outputs.exists == 'false'
        run: |
          if gh release download --pattern names.json --dir /tmp/prev 2>/dev/null; then
            ( cd packages/tokens && node scripts/names.ts /tmp/prev/names.json )
          else
            echo "no previous release; skipping"
          fi
      - name: Render the LaTeX demo documents (PDF + first-page PNG, attached to the release and shown in the README)
        if: steps.v.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils
          packages/latex/scripts/build.sh packages/latex/templates/*.tex
          pdffonts packages/latex/build/report.pdf | grep -qi sgi
          for f in packages/latex/build/*.pdf; do pdftoppm -r 70 -f 1 -l 1 -png -singlefile "$f" "${f%.pdf}"; done
      - name: Build release assets
        if: steps.v.outputs.exists == 'false'
        run: scripts/release-assets.sh
      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        run: |
          v="${{ steps.v.outputs.version }}"
          # Draft first, upload in chunks (hundreds of small assets stalled a single create), check every file arrived, then publish.
          gh release create "v$v" --draft --target "$GITHUB_SHA" --title "Jupiter design system v$v" \
            --notes "Generated from jupiter.tokens.json at $GITHUB_SHA. Use unversioned URLs under .../releases/latest/download/ to track current."
          # SVGs, PNGs and PDFs go up through the API with an explicit content type. `gh release upload` falls back to application/octet-stream on the runner,
          # and browsers (and GitHub's image proxy) refuse an octet-stream SVG in <img>, so the README logo and graphics would not render.
          # a draft is not found by tag, so read its id from the list (newest first)
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" -q "[.[]|select(.tag_name==\"v$v\")][0].id")"
          case "$id" in ''|*[!0-9]*) echo "could not find the draft release id: $id"; exit 1;; esac
          ( cd release && ls | grep -vE '\.(svg|png|pdf)$' | xargs -n 50 sh -c 'for i in 1 2 3; do gh release upload "v'"$v"'" "$@" --clobber && break || sleep 5; done' _ )
          ( cd release && ls | grep -E '\.(svg|png|pdf)$' | xargs -P 8 -I{} sh -c 'case "{}" in *.svg) t=image/svg+xml;; *.png) t=image/png;; *) t=application/pdf;; esac; for i in 1 2 3; do curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $t" --data-binary @"{}" "https://uploads.github.com/repos/'"$GITHUB_REPOSITORY"'/releases/'"$id"'/assets?name={}" && exit 0; sleep 3; done; echo "failed: {}"; exit 1' )
          want="$(ls release | wc -l)"; have="$(gh release view "v$v" --json assets -q '.assets|length')"
          if [ "$want" != "$have" ]; then echo "uploaded $have of $want assets"; exit 1; fi
          gh release edit "v$v" --draft=false --latest
      - name: Publish the npm packages to GitHub Packages (projects depend on these; skips versions already published)
        run: node scripts/publish-packages.mjs --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble Pages site (current + every released version)
        if: steps.v.outputs.exists == 'false' && vars.CLOUDFLARE_PAGES_PROJECT != ''
        run: |
          v="${{ steps.v.outputs.version }}"
          mkdir -p site/current "site/v$v"
          # the merged app (design-system docs + admin template, one SPA) at the site root; real files win over the fallback below
          cp -R apps/admin/dist/. site/
          printf '/* /index.html 200\n' > site/_redirects
          cp release/* site/current/; cp release/* "site/v$v/"
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            [ "$tag" = "v$v" ] && continue
            mkdir -p "site/$tag" && gh release download "$tag" --dir "site/$tag" --pattern '*.css' --pattern '*.html' --pattern '*.json' --pattern '*.sh' --pattern '*.sty' --pattern '*.Xresources' || true
          done
          cat > site/_headers <<'HDR'
          /*
            Access-Control-Allow-Origin: *
          /current/*
            Cache-Control: public, max-age=300
          /v*
            Cache-Control: public, max-age=31536000, immutable
          HDR
      - name: Deploy to Cloudflare Pages
        if: steps.v.outputs.exists == 'false' && vars.CLOUDFLARE_PAGES_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
