[package]
name = "jupiter-theme"
version = "1.3.0"
edition = "2021"
description = "Jupiter design tokens for Rust: palettes, type, spacing and adapters for ratatui, egui and iced."
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
egui = { version = "0.37.0", default-features = false, optional = true }
iced_core = { version = "0.14", optional = true }
ratatui = { version = "0.30.2", default-features = false, optional = true }

[features]
ratatui = ["dep:ratatui"]
egui = ["dep:egui"]
iced = ["dep:iced_core"]

[dev-dependencies]
# Terminal backend for examples/tui_dashboard.rs only; the library itself stays backend-free.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

[[example]]
name = "tui_dashboard"
required-features = ["ratatui"]
test = true
